<!DOCTYPE html>
<html>
<head>
    <title>Sensor Data</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { 
            text-align: center; 
        }

        .sensor-box { 
            display: inline-block; 
            border: 1px solid black; 
            padding: 10px; 
            margin: 10px;
            width: 300px;
        }

        .value { 
            font-size: 24px; 
            font-weight: bold; 
        }

        .time { 
            font-size: 12px; 
            color: #555; 
        }

        .chart-container { 
            width: 100%; 
            height: 200px; 
        }

        .irrigation-info {
            margin-top: 20px;
            font-size: 20px;
        }

        .irrigation-info p {
            margin: 10px;
        }
    </style>
</head>

<body>

    <h1>Sensor Data Dashboard</h1>
    
    <div>

        <div class="sensor-box">
            <h2>Moisture</h2>
            <p class="value" id="moisture-val">--</p>
            <p class="time" id="moisture-time">Waiting for data...</p>

            <div class="chart-container">
                <canvas id="moistureChart"></canvas>
            </div>
        </div>

        <div class="sensor-box">
            <h2>Temperature</h2>
            <p class="value" id="temp-val">--</p>
            <p class="time" id="temp-time">Waiting for data...</p>

            <div class="chart-container">
                <canvas id="tempChart"></canvas>
            </div>
        </div>

        <div class="sensor-box">
            <h2>Humidity</h2>
            <p class="value" id="humidity-val">--</p>
            <p class="time" id="humidity-time">Waiting for data...</p>

            <div class="chart-container">
                <canvas id="humidityChart"></canvas>
            </div>
        </div>

    </div>

    <div class="irrigation-info">
        <p>
            Last time watered:
            <strong id="last-watered">Loading...</strong>
        </p>
    </div>

    <script>

        function createChart(ctxId, label) {
            return new Chart(document.getElementById(ctxId), {
                type: 'line',
                data: { 
                    labels: [], 
                    datasets: [{ 
                        label: label, 
                        data: [], 
                        borderColor: 'black', 
                        borderWidth: 1,
                        pointRadius: 1,
                        fill: false
                    }] 
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false
                }
            });
        }

        const moistureChart = createChart('moistureChart', 'Moisture');
        const tempChart = createChart('tempChart', 'Temp');
        const humidityChart = createChart('humidityChart', 'Humidity');


        function formatDateTime(dateTime) {

            if (!dateTime || dateTime === "N/A") {
                return dateTime;
            }

            const [date, time] = dateTime.split(" ");
            const [year, month, day] = date.split("-");

            return `${day}/${month}/${year} ${time}`;
        }


        function fetchAndUpdateData() {

            fetch('/data/latest')
                .then(response => response.json())
                .then(data => {

                    if(data.moisture) {

                        document.getElementById('moisture-val').innerText =
                            data.moisture.value;

                        document.getElementById('moisture-time').innerText =
                            formatDateTime(data.moisture.time);
                    }

                    if(data.temp) {

                        document.getElementById('temp-val').innerText =
                            data.temp.value;

                        document.getElementById('temp-time').innerText =
                            formatDateTime(data.temp.time);
                    }

                    if(data.humidity) {

                        document.getElementById('humidity-val').innerText =
                            data.humidity.value;

                        document.getElementById('humidity-time').innerText =
                            formatDateTime(data.humidity.time);
                    }

                });


            fetch('/data/graph')
                .then(response => response.json())
                .then(data => {

                    updateChart(moistureChart, data.moisture);
                    updateChart(tempChart, data.temp);
                    updateChart(humidityChart, data.humidity);

                });


            fetch('/data/last-watered')
                .then(response => response.json())
                .then(data => {

                    document.getElementById('last-watered').innerText =
                        formatDateTime(data.time);

                });

        }


        function updateChart(chart, chartData) {

            if (!chartData || chartData.length === 0)
                return;

            chart.data.labels =
                chartData.map(d => d.time.split(" ")[1]);

            chart.data.datasets[0].data =
                chartData.map(d => d.value);

            chart.update();
        }


        fetchAndUpdateData();

        setInterval(fetchAndUpdateData, 5000);

    </script>

</body>
</html>
